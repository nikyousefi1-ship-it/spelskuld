<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelskulden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e3e1da;--ac:#2f6f5e;--acx:#fff;--red:#b3402f;--grn:#2f7a4a;--okbg:#e2f3e8;--badbg:#fbe4df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#efeee9;--mut:#9b9a93;--bd:#35342f;--ac:#5fb59d;--acx:#10201b;--red:#e57a67;--grn:#6fcb8f;--okbg:#1c3326;--badbg:#3a211c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#efeee9;--mut:#9b9a93;--bd:#35342f;--ac:#5fb59d;--acx:#10201b;--red:#e57a67;--grn:#6fcb8f;--okbg:#1c3326;--badbg:#3a211c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 12px}
h2{font-size:17px;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
input,select{width:100%}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
#undo{width:100%;margin-bottom:14px;font-weight:600}
.check{border-radius:12px;padding:14px;margin-bottom:14px;font-weight:600}
.ok{background:var(--okbg);color:var(--grn)}
.bad{background:var(--badbg);color:var(--red)}
.check small{display:block;font-weight:400;color:var(--tx);margin-top:2px}
.person{border-top:1px solid var(--bd);padding:10px 0}
.person:first-of-type{border-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.name{font-weight:700}
.bal{font-weight:700;font-size:18px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.ctl{display:flex;gap:6px}
.ctl input{flex:1;min-width:0}
.ctl button{font-weight:700;padding:8px 14px}
.x{border:0;background:none;color:var(--mut);padding:2px 6px}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input:first-child{flex:2 1 120px}.add input:nth-child(2){flex:1 1 90px}
.add button{flex:1 1 auto}
.flt{display:flex;gap:6px;margin:8px 0}
.flt button{flex:1}
.pay{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-bottom:6px}
.pay input{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.pay.done{opacity:.55}
.pay.done span{text-decoration:line-through}
.st{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:15px}
details{border-top:1px solid var(--bd);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer}
textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,monospace;display:none;margin-top:8px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px}
#img{max-width:100%;border-radius:10px;margin-top:8px;display:none;border:1px solid var(--bd)}
.logbox{max-height:260px;overflow-y:auto}
.mut{color:var(--mut);font-size:14px}
.sw{margin-left:auto;padding:6px 12px;border-radius:9px;background:var(--ac);color:var(--acx);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;gap:4px;padding:6px;margin:0 0 14px;background:var(--card);border:1.5px solid #3a3a42;border-radius:14px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:12px;font-weight:600;white-space:nowrap;border:0;background:transparent;color:var(--mut);border-radius:10px;transition:background .15s,color .15s}
#tabs .ti{font-size:20px;line-height:1}
body{background:radial-gradient(900px 420px at 50% -120px,#2b1a1e 0%,var(--bg) 65%) fixed}
main{padding-top:8px}
h1{text-align:center;font-size:30px;letter-spacing:.5px;margin:10px 0 16px}
[data-skin="kort"] section{border-radius:16px;padding:16px;margin-bottom:16px;animation:fi .25s ease}
h2{font-size:18px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){[data-skin="kort"] section{animation:none}}
input,select,textarea{border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(224,68,77,.28)}
button{transition:transform .08s,background .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
button.p{background:linear-gradient(180deg,#ea5a63,#c93640);border-color:#c93640;box-shadow:0 2px 6px rgba(201,54,64,.35)}
#undo{border-radius:12px;padding:10px;color:var(--mut)}
.check{text-align:center;font-size:17px;border:1px solid transparent}
.ok{border-color:rgba(111,203,143,.35)}
.bad{border-color:rgba(255,107,115,.35)}
.check small{margin-top:4px}
.person,.person:first-of-type{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.025)}
.person.up{border-left:4px solid var(--grn)}
.person.dn{border-left:4px solid var(--red)}
.top{margin-bottom:10px}
.name{display:flex;align-items:center;gap:6px;font-size:17px}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-right:4px;flex:none}
.bal{font-size:20px;font-variant-numeric:tabular-nums}
.ctl button{min-width:50px}
.pay{border-radius:12px;padding:12px 14px}
.st{font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--bd)}
summary{font-weight:600;padding:2px 0}
:root{--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
:root:root[data-skin="kort"][data-mode="dark"]{--bg:#0e0d11;--card:#17161b;--tx:#f5f2ea;--mut:#9d99a3;--bd:#2c2a33;--ac:#e5484d;--red:#ff7b82;--grn:#6fd49a;--okbg:#12281d;--badbg:#341a1d}
:root[data-mode="dark"] section{border-color:#34323b;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),3px 3px 0 rgba(0,0,0,.55)}
html{scroll-behavior:smooth}
body{font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
[data-skin="kort"] h1,[data-skin="kort"] h2{font-family:var(--serif);font-weight:700}
h1{font-size:32px;letter-spacing:.3px}
h2{font-size:19px;letter-spacing:.2px}
.name{font-weight:600}
.bal,.st,.pay{font-feature-settings:"tnum" 1}
.bal{font-weight:700;letter-spacing:-.2px}
.mut{font-size:13.5px;line-height:1.45}
summary{letter-spacing:.2px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body::before,body::after{position:fixed;pointer-events:none;z-index:-1;font-size:280px;line-height:1}
body::before{content:"\2660";right:-40px;top:110px;color:#fff;opacity:.025}
body::after{content:"\2665";left:-50px;bottom:20px;color:var(--ac);opacity:.05}
.ok{box-shadow:0 0 22px rgba(111,212,154,.14)}
.pay{transition:opacity .2s,background .15s}
.toast{animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(1.15)}.person:hover{background:rgba(255,255,255,.04)}}
#tabs button.p{background:var(--ac);color:var(--acx)}
.ro .ctl,.ro .x,.ro #undo,.ro #zero,.ro section:has(#addP),.ro section:has(#imgo){display:none!important}
.ro .pay{pointer-events:none}
:root:root[data-skin="kort"][data-mode="dark"]{--bg:#121214;--card:#1c1c20;--tx:#f2efe8;--mut:#a09c94;--bd:#34343a;--ac:#e0444d;--acx:#fff;--red:#ff6b73;--grn:#6fcb8f;--okbg:#17301f;--badbg:#3a1a1c;color-scheme:dark}
:root[data-mode="dark"] section{border-color:#3a3a42;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
#skin{font-size:20px;padding:4px 10px}
:root:root[data-skin="kort"]{--bg:#f4f1ea;--card:#fffdf8;--tx:#16161a;--mut:#6a6660;--bd:#d8d2c4;--ac:#b3202a;--acx:#fff;--red:#b3202a;--grn:#1d6b45;--okbg:#e6f1e8;--badbg:#f7dfde;color-scheme:light}
[data-skin="kort"] section{border:1.5px solid #16161a;border-radius:12px;box-shadow:3px 3px 0 rgba(22,22,26,.18)}
[data-skin="kort"] h1,[data-skin="kort"] h2{font-family:Georgia,"Times New Roman",serif}
[data-skin="kort"] h1::after{content:" \2660\2665";color:var(--red);font-size:.8em}
[data-skin="kort"] h2::before{margin-right:6px}
[data-skin="kort"] section:nth-of-type(4n+1) h2::before{content:"\2660"}
[data-skin="kort"] section:nth-of-type(4n+2) h2::before{content:"\2665";color:var(--red)}
[data-skin="kort"] section:nth-of-type(4n+3) h2::before{content:"\2663"}
[data-skin="kort"] section:nth-of-type(4n) h2::before{content:"\2666";color:var(--red)}
</style>
</head>
<body>
<main>
<h1>🎲 Spelskulden</h1>
<div id="check" class="check"></div>
<button id="undo" disabled>↩ Ångra senaste ändring</button>


<section>
<h2>📅 Avräkningsdatum</h2>
<div id="next"></div>
<details><summary>Visa alla datum</summary><div id="dls"></div></details>
</section>

<section>
<h2>Personer</h2>
<input id="q" placeholder="Sök på namn …">
<div class="flt"><button data-f="all">Alla</button><button data-f="plus">Plus</button><button data-f="minus">Minus</button></div>
<div id="list"></div>
</section>

<section>
<h2>Lägg till person</h2>
<div class="add"><input id="nn" placeholder="Namn" maxlength="30"><input id="nb" type="number" inputmode="decimal" step="any" placeholder="Saldo (kr)"><button class="p" id="addP">Lägg till</button></div>
</section>

<section>
<h2>📥 Importera ändringar</h2>

<textarea id="imt" placeholder="Alvin +200&#10;Carl -150&#10;Affe -50" style="display:block;min-height:90px;margin:0 0 8px"></textarea>
<div class="add"><button class="p" id="imgo">Lägg in text</button><button id="imb">📷 Välj bild</button></div>
<input type="file" id="imf" accept="image/*" style="display:none">
<div id="imr" class="mut" style="margin-top:8px"></div>
</section>

<section>
<h2>Så blir alla nollade</h2>


<div id="settle"></div>
<details style="margin-top:8px"><summary>Swish-nummer</summary><div id="tels"></div></details>
</section>

<section>
<h2>Sparade månader</h2>
<div id="arch"></div>
</section>

<section>
<h2>🏆 Rekord och statistik</h2>
<div id="stats"></div>
</section>

<section>
<h2>Dela</h2>
<div class="add"><button id="cp">📋 Kopiera text</button><button id="im">🖼️ Skapa bild</button></div>
<textarea id="sh" readonly></textarea>
<button id="hst" style="display:none;width:100%;margin-top:8px">✕ Stäng texten</button>
<img id="img" alt="Saldon">
<button id="shr" style="display:none;width:100%;margin-top:8px">📤 Dela bilden</button>
<button id="hid" style="display:none;width:100%;margin-top:8px">✕ Stäng bilden</button>
</section>

<section>
<h2>Logg</h2>
<input id="lq" placeholder="Sök på person i loggen …" style="margin-bottom:8px">
<div id="log" class="logbox"></div>
</section>

<p class="mut" id="cloud"></p>
</main>

<script>
const KEY='saldokollen-v1';
const SEED=[["Affe",-2030],["Alvin",1000],["Nik",1600],["Malte",445],["Isak",-50],["Carl",-2695],["Love",-220],["Alex",-35],["Ludvig",2180],["Adriano",-305],["Albin",110],["Olle",0],["Neo",0]];
const ld=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
let P=ld(KEY,SEED.map(([n,b])=>({n,b}))),D=ld(KEY+'-paid',[]),LOG=ld(KEY+'-log',[]),AR=ld(KEY+'-arch',[]);
let H=[],flt='all',blob=null;
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let DB=null,wt=null;const mine=new Set();
const cl=t=>{const e=document.getElementById('cloud');if(e)e.textContent=t};
const save=()=>{sv(KEY,P);sv(KEY+'-paid',D);sv(KEY+'-log',LOG);sv(KEY+'-arch',AR);if(DB&&!ro()){clearTimeout(wt);wt=setTimeout(pushDb,400)}};
function pushDb(){const ts=Date.now();mine.add(ts);DB.set({P,D,LOG,AR,ts}).then(()=>cl('')).catch(()=>cl('⚠️ Kunde inte spara online – sparas bara på den här enheten.'))}
async function initDb(){
  try{
    if(!window.claude)return;
    const db=await window.claude.use('db');if(!db)return;
    DB=db.doc('state/main');let first=true;
    DB.onSnapshot(s=>{
      if(!s.exists){if(first){first=false;pushDb()}return}
      first=false;const d=s.data();
      cl('');
      if(mine.has(d.ts))return;
      const c=x=>JSON.parse(JSON.stringify(x));
      if(d.P){P=c(d.P);D=c(d.D||[]);LOG=c(d.LOG||[]);AR=c(d.AR||[]);sv(KEY,P);sv(KEY+'-paid',D);sv(KEY+'-log',LOG);sv(KEY+'-arch',AR);render()}
    },()=>{});
  }catch(e){}
}
initDb();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=v=>(Math.round(v*100)/100).toLocaleString('sv-SE',{maximumFractionDigits:2});
const sg=v=>(v>0?'+':'')+f(v)+' kr';
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?NaN:x};
const sum=()=>Math.round(P.reduce((a,p)=>a+p.b,0)*100)/100;
const r2=v=>Math.round(v*100)/100;
const snap=()=>{H.push(JSON.stringify({P,D,LOG}));if(H.length>50)H.shift()};
const log=x=>{LOG.unshift({t:Date.now(),x});if(LOG.length>300)LOG.length=300};
const edit=x=>{snap();D=[];log(x)};
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.className='toast';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:15px;max-width:90%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};

const DL=[['September 2026','2026-09-30'],['Oktober 2026','2026-10-30'],['November 2026','2026-11-30'],['December 2026','2026-12-30'],['Januari 2027','2027-01-29'],['Februari 2027','2027-02-26'],['Mars 2027','2027-03-31'],['April 2027','2027-04-30'],['Maj 2027','2027-05-31'],['Juni 2027','2027-06-30']];
const dt=s=>new Date(s+'T00:00:00');
const tod=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dlTxt=x=>+x[1].slice(8)+' '+x[0].toLowerCase();
const curMonth=()=>{const T=tod(),d=DL.findIndex(x=>!AR.some(r=>r.label===x[0])&&dt(x[1])>=new Date(T.getTime()-5*864e5));return DL[d>=0?d:DL.length-1][0]};

function orig(){
  const m={};P.forEach(p=>m[p.n]=p.b);
  D.forEach(k=>{const q=k.split('|'),a=parseFloat(q[2]);if(q[0] in m)m[q[0]]-=a;if(q[1] in m)m[q[1]]+=a});
  Object.keys(m).forEach(n=>m[n]=r2(m[n]));
  return m;
}
function settle(){
  const m=orig();
  const cr=Object.keys(m).filter(n=>m[n]>0).map(n=>[n,Math.round(m[n]*100)]).sort((a,b)=>b[1]-a[1]);
  const db=Object.keys(m).filter(n=>m[n]<0).map(n=>[n,Math.round(-m[n]*100)]).sort((a,b)=>b[1]-a[1]);
  const out=[];let i=0,j=0;
  while(i<cr.length&&j<db.length){
    const x=Math.min(cr[i][1],db[j][1]);
    out.push([db[j][0],cr[i][0],x/100]);
    cr[i][1]-=x;db[j][1]-=x;
    if(!cr[i][1])i++;if(!db[j][1])j++;
  }
  return out;
}
const ranked=()=>P.map((p,i)=>i).sort((a,b)=>P[b].b-P[a].b);

function swish(x){
  const p=P.find(q=>q.n===x[1]),tel=p&&p.tel?String(p.tel).replace(/\D/g,''):'';
  if(!tel)return '';
  const d={version:1,payee:{value:tel,editable:false},amount:{value:x[2],editable:false},message:{value:'Spelskulden',editable:false}};
  return '<a class="sw" href="swish://payment?data='+encodeURIComponent(JSON.stringify(d))+'" target="_blank" rel="noopener">Swish</a>';
}
function renderStats(){
  const mk=()=>({pl:0,mi:0,sum:0,b:0,bl:'',w:0,wl:''});
  const T={};P.forEach(p=>T[p.n]=mk());
  let big=0,bigT='',paid=0,tot=0;
  AR.forEach(r=>{
    Object.keys(r.start).forEach(n=>{
      const v=r.start[n],t=T[n]||(T[n]=mk());
      if(v>0)t.pl++;else if(v<0)t.mi++;
      t.sum=r2(t.sum+v);
      if(v>t.b){t.b=v;t.bl=r.label}
      if(v<t.w){t.w=v;t.wl=r.label}
    });
    r.plan.forEach(x=>{tot++;if(x.paid)paid++;if(x.a>big){big=x.a;bigT=x.from+' → '+x.to+' ('+r.label+')'}});
  });
  const N=Object.keys(T);
  const tp=(g,d)=>N.reduce((a,n)=>a===null||d*(g(T[n])-g(T[a]))>0?n:a,null);
  const row=(l,v)=>`<div class="st"><span>${l}</span><b>${v}</b></div>`;
  const cur=[...P].sort((a,b)=>b.b-a.b),hi=cur[0],lo=cur[cur.length-1];
  let h=row('👑 Störst plus just nu',hi&&hi.b>0?esc(hi.n)+' '+sg(hi.b):'–')+row('💸 Störst minus just nu',lo&&lo.b<0?esc(lo.n)+' '+sg(lo.b):'–');
  if(!AR.length){$('stats').innerHTML=h+'<p class="mut" style="margin:8px 0 0">Fler rekord dyker upp när du har sparat minst en månad.</p>';return}
  const bw=tp(t=>t.b,1),ww=tp(t=>t.w,-1),mp=tp(t=>t.pl,1),mm=tp(t=>t.mi,1),ts=tp(t=>t.sum,1),tl=tp(t=>t.sum,-1);
  h+=row('📅 Sparade månader',AR.length);
  if(bw&&T[bw].b>0)h+=row('🏆 Största vinst en månad',esc(bw)+' '+sg(T[bw].b)+' · '+esc(T[bw].bl));
  if(ww&&T[ww].w<0)h+=row('📉 Största förlust en månad',esc(ww)+' '+sg(T[ww].w)+' · '+esc(T[ww].wl));
  if(mp&&T[mp].pl>0)h+=row('🔥 Flest månader på plus',esc(mp)+' ('+T[mp].pl+')');
  if(mm&&T[mm].mi>0)h+=row('🧊 Flest månader på minus',esc(mm)+' ('+T[mm].mi+')');
  if(ts&&T[ts].sum>0)h+=row('💰 Bäst totalt',esc(ts)+' '+sg(T[ts].sum));
  if(tl&&T[tl].sum<0)h+=row('🪙 Sämst totalt',esc(tl)+' '+sg(T[tl].sum));
  if(big)h+=row('💸 Största betalning',f(big)+' kr · '+esc(bigT));
  if(tot)h+=row('✓ Betalda betalningar',paid+' av '+tot);
  h+='<details><summary>Per person</summary>'+N.sort((a,b)=>T[b].sum-T[a].sum).map(n=>`<div class="st"><span>${esc(n)} <span class="mut">(+${T[n].pl} / −${T[n].mi})</span></span><b class="${T[n].sum>0?'pos':T[n].sum<0?'neg':''}">${sg(T[n].sum)}</b></div>`).join('')+'</details>';
  $('stats').innerHTML=h;
}
function render(){
  const t=sum(),T=tod();
  const c=$('check');
  if(t===0){c.className='check ok';c.innerHTML='✓ Det stämmer! Totalen är 0 kr.';}
  else{c.className='check bad';c.innerHTML='✗ Något är fel – totalen är '+sg(t)+', inte 0.<small>'+(t>0?'Det är '+f(t)+' kr för mycket i plus (eller för lite i minus).':'Det är '+f(-t)+' kr för mycket i minus (eller för lite i plus).')+' Kontrollera beloppen.</small>';}
  $('undo').disabled=!H.length;

  const nx=DL.findIndex(x=>dt(x[1])>=T);
  if(nx<0)$('next').innerHTML='<span class="mut">Alla avräkningar är passerade.</span>';
  else{const d=Math.round((dt(DL[nx][1])-T)/864e5);$('next').innerHTML='Nästa avräkning: <b>'+dlTxt(DL[nx])+'</b> – '+(d===0?'idag!':d===1?'imorgon':'om '+d+' dagar')+'<div class="mut">Då ska alla saldon vara på noll.</div>';}
  $('dls').innerHTML=DL.map((x,i)=>{const a=AR.some(r=>r.label===x[0]),d=dt(x[1]);return '<div class="st"><span>'+dlTxt(x)+'</span><b class="'+(a?'pos':d<T?'neg':'')+'">'+(a?'✓ Sparad':d<T?'Passerat':i===nx?'Nästa':'Kommande')+'</b></div>'}).join('');

  
  
  

  const order=ranked();
  const medal=i=>{const p=P[i];return order[0]===i&&p.b>0?'👑':order[order.length-1]===i&&p.b<0?'💸':''};
  const ql=$('q').value.trim().toLowerCase();
  const shown=order.filter(i=>P[i].n.toLowerCase().includes(ql)&&(flt==='all'||(flt==='plus'?P[i].b>0:P[i].b<0)));
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('p',b.dataset.f===flt));
  if(!$('tels').contains(document.activeElement))$('tels').innerHTML=P.map((p,i)=>`<div class="st"><span>${esc(p.n)}</span><input data-tel="${i}" type="tel" inputmode="tel" placeholder="07x xxx xx xx" value="${esc(p.tel||'')}"${ro()?' readonly':''} style="width:150px"></div>`).join('');
  $('list').innerHTML=shown.length?shown.map(i=>{const p=P[i];return `<div class="person ${p.b>0?'up':p.b<0?'dn':''}"><div class="top"><span class="name"><span class="av">${esc((p.n[0]||'?').toUpperCase())}</span>${medal(i)} ${esc(p.n)}</span><span><span class="bal ${p.b>0?'pos':p.b<0?'neg':''}">${sg(p.b)}</span> <button class="x" data-rm="${i}" aria-label="Ta bort ${esc(p.n)}">✕</button></span></div><div class="ctl"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Belopp" id="a${i}"><button data-op="-1" data-i="${i}" aria-label="Minska">−</button><button data-op="1" data-i="${i}" aria-label="Öka">+</button></div></div>`}).join(''):'<p class="mut" style="margin:0">'+(P.length?'Inga träffar.':'Inga personer.')+'</p>';

  if(t!==0)$('settle').innerHTML='<p class="mut" style="margin:0">Totalen måste vara 0 först, annars går det inte att nolla alla.</p>';
  else{
    const s=settle(),all=s.length&&s.every(x=>D.includes(x.join('|')));
    $('settle').innerHTML=s.length?`<p class="mut" style="margin:0 0 8px">${s.filter(x=>D.includes(x.join('|'))).length} av ${s.length} betalda</p>`+s.map(x=>{const k=x.join('|'),d=D.includes(k);return `<label class="pay${d?' done':''}"><input type="checkbox" data-pay="${esc(k)}"${d?' checked':''}><span><b>${esc(x[0])}</b> betalar <b>${esc(x[1])}</b> <b>${f(x[2])} kr</b></span></label>`}).join('')+(all?'<button class="p" id="zero" style="width:100%;margin-top:6px">Spara '+curMonth()+' och börja om</button>':''):'<p class="mut" style="margin:0">Alla är redan på noll.</p>';
  }

  const row=(n,b)=>`<div class="st"><span>${esc(n)}</span><b class="${b>0?'pos':b<0?'neg':''}">${sg(b)}</b></div>`;
  $('arch').innerHTML=AR.length?AR.map(r=>`<details><summary><b>${esc(r.label)}</b> · sparad ${r.saved}</summary><div class="mut" style="margin:6px 0 2px">Saldon vid start</div>${Object.keys(r.start).map(n=>row(n,r.start[n])).join('')}<div class="mut" style="margin:8px 0 2px">Betalningar</div>${r.plan.length?r.plan.map(x=>`<div class="st"><span>${x.paid?'✓':'✗'} ${esc(x.from)} → ${esc(x.to)}</span><b>${f(x.a)} kr</b></div>`).join(''):'<div class="st"><span>Inga</span></div>'}</details>`).join(''):'<p class="mut" style="margin:0">Inga sparade månader ännu.</p>';

  renderStats();
  const lq=$('lq').value.trim().toLowerCase(),LG=LOG.filter(l=>l.x.toLowerCase().includes(lq));
  $('log').innerHTML=LG.length?LG.map(l=>`<div class="st"><span>${esc(l.x)}</span><span class="mut" style="white-space:nowrap">${new Date(l.t).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'})}</span></div>`).join(''):'<p class="mut" style="margin:0">'+(LOG.length?'Inga träffar.':'Inga ändringar ännu.')+'</p>';
}

$('q').oninput=render;$('lq').oninput=render;
const TABS=[['👥','Saldon',['Personer','Lägg till person','Importera ändringar']],['💸','Betalningar',['Avräkningsdatum','Så blir alla nollade']],['📚','Historik',['Sparade månader','Rekord och statistik','Logg']],['📤','Dela',['Dela']]];
let tab=ld('spelskulden-tab',0);
const secs=[...document.querySelectorAll('main > section')];
secs.forEach(s=>{const h=((s.querySelector('h2')||{}).textContent||'').trim();const i=TABS.findIndex(t=>t[2].some(n=>h.endsWith(n)));s.dataset.tab=i<0?0:i});
const nav=document.createElement('nav');nav.id='tabs';secs[0].before(nav);
function showTab(){nav.innerHTML=TABS.map((t,i)=>`<button data-t="${i}"${i===tab?' class="p"':''}><span class="ti">${t[0]}</span><span>${t[1]}</span></button>`).join('');secs.forEach(s=>{s.style.display=+s.dataset.tab===tab?'':'none'})}
nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=+b.dataset.t;sv('spelskulden-tab',tab);showTab();window.scrollTo(0,0)};
showTab();
$('tels').onchange=e=>{if(ro())return;const i=e.target.dataset.tel;if(i===undefined||!P[i])return;P[i].tel=e.target.value.trim();save();render()};
const UKK='spelskulden-uk';let CH=ld('spelskulden-ch',''),UK=ld(UKK,''),chLock=0;
const ro=()=>false;
const applySkin=()=>{const r=document.documentElement;r.dataset.skin='kort';r.dataset.mode='dark'};
applySkin();

const hasName=(line,n)=>{const l=line.toLowerCase(),k=n.toLowerCase();let i=l.indexOf(k);while(i>=0){if(!/\p{L}/u.test(l[i-1]||' ')&&!/\p{L}/u.test(l[i+k.length]||' '))return i;i=l.indexOf(k,i+1)}return -1};
function parseText(t){
  const out=[],miss=[];
  t.split(/[\n;]+|,\s+(?=\p{L})/u).forEach(raw=>{
    const line=raw.trim();if(!line)return;
    let hit=null,idx=-1;
    P.forEach(p=>{const i=hasName(line,p.n);if(i>=0&&(!hit||p.n.length>hit.n.length)){hit=p;idx=i}});
    if(!hit){if(/\d/.test(line))miss.push(line);return}
    const rest=line.slice(0,idx)+' '+line.slice(idx+hit.n.length);
    const m=rest.match(/([+\-−–])?\s*(\d+(?:[ \u00a0]\d{3})*(?:[.,]\d+)?)/);
    if(!m){miss.push(line);return}
    const a=parseFloat(m[2].replace(/[ \u00a0]/g,'').replace(',','.'));
    out.push({n:hit.n,v:(m[1]&&'-−–'.includes(m[1])?-1:1)*a});
  });
  return{out,miss};
}
function applyCh(ch,extra){
  const ok=[],miss=[...(extra||[])];
  snap();D=[];
  ch.forEach(c=>{
    const p=P.find(x=>x.n.toLowerCase()===String(c.n).toLowerCase());
    if(!p||!isFinite(c.v)||!c.v){miss.push(String(c.n)+' '+c.v);return}
    p.b=r2(p.b+c.v);
    const t=(c.v>0?'+':'−')+f(Math.abs(c.v));
    log(p.n+': '+t+' kr (saldo '+f(p.b)+' kr)');ok.push(p.n+' '+t);
  });
  if(ok.length){save();render()}else{D=JSON.parse(H.pop()).D}
  $('imr').textContent=(ok.length?'✓ Ändrade: '+ok.join(', ')+'. ':'Inga saldon ändrades. ')+(miss.length?'Kunde inte tolka: '+miss.join(' | ')+'.':'');
  return ok.length;
}
$('imgo').onclick=()=>{if(ro())return;
  const t=$('imt').value;if(!t.trim()){toast('Klistra in text först.');return}
  const r=parseText(t);
  if(applyCh(r.out,r.miss))$('imt').value='';
};
$('imb').onclick=()=>$('imf').click();
$('imf').onchange=async()=>{if(ro())return;
  const fl=$('imf').files[0];if(!fl)return;
  $('imr').textContent='Läser av bilden …';
  try{
    const sample=window.claude&&await window.claude.use('sample');
    if(!sample){$('imr').textContent='Bildläsning är inte tillgänglig här. Klistra in texten i stället.';return}
    const data=await sample.json('Bilden innehåller en lista där personer har plus- eller minusbelopp. Läs av varje person och belopp. Kända namn: '+P.map(p=>p.n).join(', ')+'. Använd exakt stavning från de kända namnen när det går. Svara ENBART med en JSON-array: [{"n":"Namn","v":-150}], där v är ett tal med tecken (plus = positivt, minus = negativt).',{images:[fl]});
    applyCh(Array.isArray(data)?data.map(d=>({n:d.n,v:Number(d.v)})):[]);
  }catch(e){$('imr').textContent='Kunde inte läsa bilden ('+((e&&e.code)||'fel')+'). Prova igen eller klistra in texten.'}
  $('imf').value='';
};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
$('list').onclick=e=>{if(ro())return;
  const rm=e.target.dataset.rm;
  if(rm!==undefined){const n=P[rm].n;edit('Tog bort '+n);P.splice(rm,1);save();render();return}
  const op=e.target.dataset.op;if(!op)return;
  const i=+e.target.dataset.i,v=num($('a'+i).value);
  if(!(v>0)){toast('Skriv in ett belopp först.');return}
  const nb=r2(P[i].b+op*v);
  edit(P[i].n+': '+(op>0?'+':'−')+f(v)+' kr (saldo '+f(nb)+' kr)');
  P[i].b=nb;save();render();
};
$('addP').onclick=()=>{if(ro())return;
  const n=$('nn').value.trim().replace(/\|/g,'');if(!n)return;
  const b=$('nb').value===''?0:num($('nb').value);
  if(isNaN(b)){toast('Ogiltigt belopp.');return}
  edit('La till '+n+' ('+f(b)+' kr)');P.push({n,b});$('nn').value='';$('nb').value='';save();render();
};
$('settle').onchange=e=>{if(ro())return;
  const k=e.target.dataset.pay;if(k===undefined)return;
  const q=k.split('|'),a=parseFloat(q[2]),s=e.target.checked?1:-1;
  const A=P.find(p=>p.n===q[0]),B=P.find(p=>p.n===q[1]);
  if(!A||!B){render();return}
  snap();log(s>0?A.n+' betalade '+B.n+' '+f(a)+' kr':'Ångrade: '+A.n+' → '+B.n+' '+f(a)+' kr');
  A.b=r2(A.b+s*a);B.b=r2(B.b-s*a);
  D=s>0?[...D,k]:D.filter(x=>x!==k);save();render();
};
$('settle').onclick=e=>{if(ro())return;
  if(e.target.id!=='zero')return;
  const lab=curMonth(),s=settle();
  AR=AR.filter(r=>r.label!==lab);
  AR.unshift({id:Date.now(),label:lab,saved:iso(new Date()),start:orig(),plan:s.map(x=>({from:x[0],to:x[1],a:x[2],paid:D.includes(x.join('|'))})),end:Object.fromEntries(P.map(p=>[p.n,p.b]))});
  snap();log('Sparade '+lab);D=[];save();render();toast(lab+' sparad ✓');
};
$('undo').onclick=()=>{if(ro())return;
  if(!H.length)return;
  const s=JSON.parse(H.pop());P=s.P;D=s.D;LOG=s.LOG||LOG;save();render();
};

function shareText(){
  const o=ranked(),s=sum()===0?settle():[];
  let t='Spelskulden '+iso(new Date())+'\n\n'+o.map(i=>P[i].n+': '+sg(P[i].b)).join('\n');
  if(s.length)t+='\n\nBetalningar:\n'+s.map(x=>(D.includes(x.join('|'))?'✓ ':'• ')+x[0]+' → '+x[1]+': '+f(x[2])+' kr').join('\n');
  const nx=DL.find(x=>dt(x[1])>=tod());
  if(nx)t+='\n\nNästa avräkning: '+dlTxt(nx);
  return t;
}
$('cp').onclick=()=>{
  const t=shareText(),ta=$('sh');
  ta.value=t;ta.style.display='block';$('hst').style.display='block';ta.select();
  const ok=()=>{toast('Kopierat! Klistra in i gruppchatten.');$('hst').click()};
  const fb=()=>{try{document.execCommand('copy')?ok():toast('Markera texten och kopiera den.')}catch(e){toast('Markera texten och kopiera den.')}};
  try{navigator.clipboard.writeText(t).then(ok).catch(fb)}catch(e){fb()}
};
$('im').onclick=()=>{
  const o=ranked(),s=sum()===0?settle():[];
  const h=130+o.length*40+(s.length?80+s.length*36:0);
  const c=document.createElement('canvas');c.width=800;c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,800,h);
  x.fillStyle='#1d1d1b';x.font='bold 34px system-ui,sans-serif';x.textAlign='left';x.fillText('Spelskulden',40,60);
  x.fillStyle='#6b6b66';x.font='20px system-ui,sans-serif';x.fillText(iso(new Date()),40,90);
  const line=(y,a,b,col)=>{x.strokeStyle='#e3e1da';x.beginPath();x.moveTo(40,y-28);x.lineTo(760,y-28);x.stroke();x.fillStyle='#1d1d1b';x.font='24px system-ui,sans-serif';x.textAlign='left';x.fillText(a,40,y);x.fillStyle=col;x.font='bold 24px system-ui,sans-serif';x.textAlign='right';x.fillText(b,760,y)};
  let y=146;
  o.forEach(i=>{line(y,P[i].n,sg(P[i].b),P[i].b>0?'#2f7a4a':P[i].b<0?'#b3402f':'#6b6b66');y+=40});
  if(s.length){y+=30;x.fillStyle='#1d1d1b';x.font='bold 26px system-ui,sans-serif';x.textAlign='left';x.fillText('Betalningar – senast '+dlTxt(DL.find(z=>z[0]===curMonth())),40,y);y+=44;
    s.forEach(z=>{line(y,(D.includes(z.join('|'))?'✓ ':'')+z[0]+' → '+z[1],f(z[2])+' kr','#1d1d1b');y+=36})}
  $('img').src=c.toDataURL('image/png');$('img').style.display='block';$('hid').style.display='block';
  c.toBlob(b=>{blob=b;if(navigator.share)$('shr').style.display='block'});
  toast('Håll in bilden för att spara den.');
};
$('hst').onclick=()=>{$('sh').style.display='none';$('hst').style.display='none'};
$('hid').onclick=()=>{$('img').style.display='none';$('img').removeAttribute('src');$('hid').style.display='none';$('shr').style.display='none';blob=null};
$('shr').onclick=()=>{
  if(!blob)return;
  const fl=new File([blob],'saldon.png',{type:'image/png'});
  try{navigator.share({files:[fl]}).catch(()=>toast('Håll in bilden för att spara den.'))}catch(e){toast('Håll in bilden för att spara den.')}
};
render();
</script>
